spring:
  application:
    name: quizforge
  # Load secrets/local settings from the .env file (never committed).
  # Works whether the app starts from the project root or from backend/ (IntelliJ).
  # Real environment variables (Docker, cloud hosting) still take priority.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it
    open-in-view: false       # forces loading data inside @Transactional services
  data:
    web:
      pageable:
        max-page-size: 50
  ai:
    # Retry transient AI failures a little, but fail fast when the model is down
    # (the default retries for minutes, leaving generation jobs hanging).
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      chat:
        options:
          model: ${OLLAMA_MODEL}
          temperature: 0.3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never          # public endpoint: status only, no internals
      probes:
        enabled: true              # /actuator/health/liveness and /readiness (Kubernetes-style)

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: true     # keep the pasted token across page reloads
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json

app:
  ai:
    generations-per-hour: ${AI_GENERATIONS_PER_HOUR:10}
  demo:
    enabled: ${DEMO_DATA:false}         # seed demo instructor/learner/quiz/classroom on startup
    password: ${DEMO_PASSWORD:demo-password-123}
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15        # short-lived; kept only in browser memory
    refresh-token-days: 7           # HttpOnly cookie, rotated on every use
    cookie-secure: ${COOKIE_SECURE:true}   # HTTPS-only cookie (browsers allow it on http://localhost too)
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
